<main class="galeria-pagina">
  <a [routerLink]="['/festa', festaId]">← Voltar à festa</a>
  <h1>Fotos da festa</h1>
  <div class="enviar">
    <input [(ngModel)]="foto" placeholder="Cole o link da imagem aqui" /><button
      (click)="publicar()"
    >
      Adicionar foto
    </button>
  </div>
  <section class="fotos">
    @for (item of galeria.fotosDaFesta(festaId); track $index) {
      <article>
        <img [src]="item.link" /><span>Enviado por {{ item.pessoa }}</span>
        @if (fotoEditando === $index) {
          <input [(ngModel)]="novoLink" placeholder="Novo link da imagem" />
          <div class="acoes-foto">
            <button (click)="salvarEdicao()">Salvar</button>
            <button (click)="cancelarEdicao()">Cancelar</button>
          </div>
        } @else {
          <button (click)="iniciarEdicao($index, item.link)">Editar foto</button>
        }
      </article>
    } @empty {
      <div class="vazio-interno">
        <h2>Nenhuma foto ainda</h2>
      </div>
    }
  </section>
</main>

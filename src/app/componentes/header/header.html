<header id="inicio">
  <nav>
    <a class="brand" routerLink="/home-page">festou!</a>
    <span class="nav-caption"></span>
    <div class="auth-actions">
      <button class="auth-button register-button" type="button">Registrar</button>
      <button class="auth-button login-button" type="button" routerLink="/login">Entrar</button>
    </div>
  </nav>
  <section class="hero">
    <div class="eyebrow"></div>
    <h1>A VIDA PEDE<span>FESTOU!</span></h1>
    <div class="intro"></div>
    <div class="gallery">
      @for (row of rows; track $index; let index = $index) {
        <div class="marquee" [class.reverse]="index === 1">
          <div class="track">
            @for (copy of copies; track copy) {
              <div class="group">
                @for (card of row; track card.id) {
                  <div
                    class="card"
                    [class.olive]="card.tone === 'olive'"
                    [class.warm]="card.tone === 'warm'"
                  >
                    @if (card.image) {
                      <img [src]="card.image" loading="lazy" draggable="false" />
                    }
                  </div>
                }
              </div>
            }
          </div>
        </div>
      }
    </div>
    <div class="gallery-footer"></div>
  </section>
</header>

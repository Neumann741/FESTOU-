<header id="inicio">
  <nav aria-label="Navegação principal">
    <a class="brand" href="#inicio">festou!</a>
    <span class="nav-caption"></span>
    <div class="auth-actions">
      <button class="auth-button register-button" type="button">Registrar</button>
      <button class="auth-button login-button" type="button" routerLink="/main-page" >Entrar</button>
    </div>
  </nav>
  <section class="hero" aria-labelledby="hero-title">
    <div class="eyebrow"></div>
    <h1 id="hero-title">A VIDA PEDE<span>FESTOU!</span></h1>
    <div class="intro">

    </div>
    <div class="gallery" role="img" aria-label="Duas fileiras de cards reservados para futuras imagens de festas">
      @for (row of rows; track $index; let index = $index) {
        <div class="marquee" [class.reverse]="index === 1">
          <div class="track">
            @for (copy of copies; track copy) {
              <div class="group" aria-hidden="true">
                @for (card of row; track card.id) {
                  <div class="card" [class.olive]="card.tone === 'olive'" [class.warm]="card.tone === 'warm'">
                    @if (card.image) {
                      <img [src]="card.image" alt="" loading="lazy" draggable="false">
                    }
                  </div>
                }
              </div>
            }
          </div>
        </div>
      }
    </div>
    <div class="gallery-footer">

    </div>
  </section>
</header>

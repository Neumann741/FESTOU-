<main>
  <section
    #story
    class="story"
    [class.static-mode]="staticMode()"
    id="universo-festou"
  >
    <div class="story-stage">
      <div class="story-layout">
       <div class="story-intro">
          <h2 id="story-title">Aqui na FESTOU!<br /><span>você...</span></h2>
        </div>
        <div class="card-deck">
          @for (card of cards; track card.label; let index = $index) {
            <article
              class="story-card"
              [style.z-index]="index + 1"
              [class.finale]="index === cards.length - 1"
              [attr.aria-labelledby]="'story-card-' + index"
            >
              <img class="card-photo" [src]="card.image" alt="" loading="lazy" />
              <div class="card-shade"></div>
              <div
                class="card-content"
                [attr.aria-hidden]="
                  index === cards.length - 1 && showRegistration() && !staticMode() ? true : null
                "
              >
              
                <h3 [id]="'story-card-' + index" >
                  {{ card.title }}<br /><span>{{ card.accent }}</span>
                </h3>
              </div>
              @if (index === cards.length - 1) {
                <button
                  class="register-cta"
                  type="button"  
                  [disabled]="!showRegistration() && !staticMode()"
                  [attr.tabindex]="showRegistration() || staticMode() ? 0 : -1"
                  [attr.aria-hidden]="!showRegistration() && !staticMode() ? true : null"
                  (click)="registerRequested.emit()"
                  routerLink="/main-page"
                >
                  Registre-se 
                </button>
              }
            </article>
          }
        </div>
      </div>
 
    </div>
  </section>
</main>
